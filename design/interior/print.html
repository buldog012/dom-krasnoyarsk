  .head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 0.4mm solid #111; padding-bottom: 2mm; }
  .head h1 { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 20pt; line-height: 1.1; }

  .head .facts { font-size: 9pt; color: #444; text-align: right; }
  .head .facts b { color: #111; }
  .body { display: grid; grid-template-columns: 300mm 1fr; gap: 8mm; align-items: start; min-height: 0; }
  .body.grid4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6mm; }
  svg { display: block; font-family: 'Manrope', Arial, sans-serif; }
  .side { font-size: 9pt; display: flex; flex-direction: column; gap: 4mm; }
  .side h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 13pt; margin: 0 0 1.5mm; }
  table { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
  th { text-align: left; font-weight: 700; font-size: 7pt; letter-spacing: .08em; text-transform: uppercase; color: #555; padding: 1mm 0; border-bottom: 0.3mm solid #111; }
  td { padding: 1.1mm 0; border-bottom: 0.15mm solid #bbb; font-variant-numeric: tabular-nums; }
  th:not(:first-child), td:not(:first-child) { text-align: right; padding-left: 2mm; white-space: nowrap; }
  tr.sum td { font-weight: 700; border-bottom: 0; }
  .legend { display: grid; grid-template-columns: 11mm 1fr; gap: 1.5mm 2mm; align-items: center; font-size: 8pt; }
  .legend svg { width: 11mm; height: 5mm; }
  .note { font-size: 8pt; color: #444; }
  .note p { margin: 0 0 1.2mm; }
  .foot { display: flex; justify-content: space-between; border-top: 0.3mm solid #111; padding-top: 1.5mm; font-size: 7.5pt; color: #444; }
  .body.grid4 { min-height: 0; }
  .mini { display: grid; grid-template-rows: auto auto auto; gap: 1.5mm; border: 0.2mm solid #999; padding: 3mm; min-height: 0; overflow: hidden; }
  .mini svg { width: auto !important; height: 94mm !important; margin: 0 auto; }
  .mini h3 { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 13pt; }
  .mini h3 em { font-style: normal; color: #A8651F; margin-right: 2mm; }
  .mini p { margin: 0; font-size: 8pt; color: #444; }
  /* чертёж */
  .wall-out { fill: #111; }
  .wall-in { fill: #444; }
  .floor { fill: #fff; stroke: none; }
  .floor-stone { fill: #F3F3F3; }
  .deck { fill: #F7F3EC; }
  .glass { stroke: #111; stroke-width: 1.4; }
  .glass-2 { stroke: #fff; stroke-width: 0.6; }
  .door-swing { fill: none; stroke: #333; stroke-width: 0.6; stroke-dasharray: 3 2; }
  .furn { fill: #ECECEC; stroke: #333; stroke-width: 0.7; }
  .furn-soft { fill: #DEDEDE; stroke: #333; stroke-width: 0.7; }
  .furn-wood { fill: #F4F0E8; stroke: #333; stroke-width: 0.7; }
  .furn-line { stroke: #333; stroke-width: 0.6; fill: none; }
  .furn-white { fill: #fff; stroke: #333; stroke-width: 0.6; }
  .room-name { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 14px; fill: #111; }
  .room-sub { font-size: 9.5px; fill: #333; font-variant-numeric: tabular-nums; }
  .dim { font-size: 9.5px; fill: #111; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .dim-line { stroke: #111; stroke-width: 0.6; }
  .op-label { font-size: 8px; fill: #333; font-variant-numeric: tabular-nums; }
  .zone { fill: none; stroke: #A8651F; stroke-width: 1; stroke-dasharray: 5 3; }
  .zone-label { font-size: 9px; font-weight: 700; fill: #A8651F; letter-spacing: .05em; }
  .zone-area { font-size: 9px; fill: #A8651F; font-variant-numeric: tabular-nums; }
  .accent-wall { stroke: #A8651F; stroke-width: 3; }
  .scale-text { font-size: 9px; fill: #111; }
